<script>
let visiblePosts = 0;
let allPosts = [];

async function fetchPostDate(filename) {
    try {
        const response = await fetch(`/api/commits?filename=${filename}`);
        const commits = await response.json();
        if (commits.length > 0) {
            const date = new Date(commits[0].commit.committer.date);
            return date.toLocaleDateString('bn-BD', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }
        return 'তারিখ পাওয়া যায়নি';
    } catch (error) {
        return 'তারিখ পাওয়া যায়নি';
    }
}

async function loadPosts() {
    document.getElementById('loading-indicator').style.display = 'block';

    try {
        const response = await fetch('/api/posts');
        const files = await response.json();

        allPosts = files.filter(file =>
            file.name.endsWith('.html') && file.name.toLowerCase() !== 'index.html'
        );

        visiblePosts = 0;
        document.getElementById('posts-container').innerHTML = '';
        
        await loadMorePosts();

        document.getElementById('loading-indicator').style.display = 'none';

    } catch (error) {
        console.error('Error loading posts:', error);
        alert('সমস্যা হয়েছে! একটু পরে আবার চেষ্টা করুন।');
        document.getElementById('loading-indicator').style.display = 'none';
    }
}

async function loadMorePosts() {
    const postsContainer = document.getElementById('posts-container');
    const nextPosts = allPosts.slice(visiblePosts, visiblePosts + 5);

    for (const file of nextPosts) {
        const postResponse = await fetch(file.download_url);
        const postHtml = await postResponse.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(postHtml, 'text/html');

        const title = doc.querySelector('title')?.innerText || 'নামবিহীন পোস্ট';
        const excerpt = doc.querySelector('p')?.innerText.slice(0, 130) + '...' || 'কোনো বর্ণনা নেই';
        const postDate = await fetchPostDate(file.name);

        const fileNameWithoutExt = file.name.replace('.html', '');

        const postItem = document.createElement('li');
        postItem.className = 'post-item';
        postItem.innerHTML = `
            <a href="blog/${fileNameWithoutExt}" style="text-decoration:none;color:inherit;">
                <div class="post-meta">
                    <span><i class="fas fa-sync-alt"></i> সবশেষ আপডেট : ${postDate}</span>
                </div>
                <h2 class="post-title">${title}</h2>
                <p class="post-excerpt">${excerpt}</p>
            </a>
        `;

        postsContainer.appendChild(postItem);
    }

    visiblePosts += 5;
    updateLoadMoreButton();
}

function updateLoadMoreButton() {
    const loadMoreButton = document.getElementById('loadMore');
    loadMoreButton.style.display = visiblePosts >= allPosts.length ? 'none' : 'block';
}

window.onload = loadPosts;
</script>

<script>
  function showToast(message, isError = false) {
    const toast = document.getElementById("notification");
    toast.textContent = message;
    toast.style.backgroundColor = isError ? "#dc3545" : "#198754"; // red if error
    toast.classList.add("show");

    setTimeout(() => {
      toast.classList.remove("show");
    }, 3000);
  }

  function shareContent() {
    const shareData = {
      title: 'সিলেটি থেকে বাংলা ট্রান্সলেটর',
      text: 'দেখে আসুন নতুন সিলেটি ট্রান্সলেটর',
      url: 'https://sylheti.kamildex.com/blog/sylheti-vasha-popular-word'
    };

    if (typeof window.AppInventor !== "undefined" && window.AppInventor.setWebViewString) {
      // অ্যাপে: WebViewString-এ শুধু "share" পাঠানো হবে
      window.AppInventor.setWebViewString("share");
    } else if (navigator.share) {
      // মোবাইল ব্রাউজারে: system share
      navigator.share(shareData)
        .then(() => console.log('Shared successfully'))
        .catch((error) => {
          console.log('Sharing failed, fallback to copy', error);
          fallbackCopy(shareData);
        });
    } else {
      // ডেস্কটপে fallback
      fallbackCopy(shareData);
    }
  }

  function fallbackCopy(data) {
    const fullText = `${data.text} ${data.url}`;
    navigator.clipboard.writeText(fullText)
      .then(() => {
        showToast("লিংক কপি হয়েছে! এখন বন্ধুদের কাছে পাঠান।");
      })
      .catch((err) => {
        console.error('কপি করতে সমস্যা হয়েছে:', err);
        showToast("দুঃখিত, লিংক কপি করা হয়নি।", true);
      });
  }
</script>
