        .post-title {

        .post-excerpt {
            color: var(--muted-color);
            font-size: 0.9rem;

            -webkit-box-orient: vertical;
            overflow: hidden;

        .load-more-btn {
            display: block;

            border: none;

            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(9, 132, 227, 0.2);
            text-align: center;
            transform: translateY(-2px);

        @keyframes spin {
            0% { transform: rotate(0deg); }

    <!-- Main Content -->
    <div class="app-container">
        <main class="main-content">
            <div class="translation-card">

                <div class="container">
                    <ul class="post-list" id="posts-container"></ul>

                    <div id="loading-indicator" style="text-align: center; padding: 2rem;">
                        <div class="spinner" style="margin: auto; width: 50px; height: 50px; border: 6px solid #f3f3f3; border-top: 6px solid #555; border-radius: 50%; animation: spin 1s linear infinite;"></div>
                        <p style="margin-top: 1rem;">পোস্ট লোড হচ্ছে...</p>

                    <button class="load-more-btn" onclick="loadMorePosts()" id="loadMore">আরো পোস্ট দেখুন</button>

            <div class="social-links">

                <a href="https://t.me/kamildex" class="social-link" aria-label="টেলিগ্রাম"><i class="fab fa-telegram"></i></a>
            </div>

                <p class="custom-footer-credit">
                    Designed by <strong><a href="https://portfolio.kamildex.com/" target="_blank">Kamil Dex</a></strong> &copy; <span class="copyright-year">2025</span>

        </footer>
    </div>

    <!-- Notification Toast -->
    <div id="notification" class="notification"></div>

    <!-- Scripts -->
    <script src="/assets/analytics-loader.js"></script>

    <script>
        // Menu toggle
        const menuBtn = document.querySelector('.menu-btn');
        const dropdownContainer = document.querySelector('.dropdown-container');

        menuBtn.addEventListener('click', () => {
            menuBtn.classList.toggle('active');
            dropdownContainer.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.header-container')) {
                menuBtn.classList.remove('active');
                dropdownContainer.classList.remove('active');
            }
        });

        // Share function
        function shareContent() {
            const shareData = {
                title: 'সিলেটি থেকে বাংলা ট্রান্সলেটর',
                text: 'দেখে আসুন নতুন সিলেটি ট্রান্সলেটর',
                url: 'https://sylheti.kamildex.com/blog'
            };

            if (typeof window.AppInventor !== 'undefined' && window.AppInventor.setWebViewString) {
                window.AppInventor.setWebViewString('share');
            } else if (navigator.share) {
                navigator.share(shareData).catch(() => fallbackCopy(shareData));
            } else {
                fallbackCopy(shareData);
            }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('notification');
            toast.textContent = message;
            toast.style.backgroundColor = isError ? '#dc3545' : '#198754';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function fallbackCopy(data) {
            const fullText = `${data.text} ${data.url}`;
            navigator.clipboard.writeText(fullText)
                .then(() => showToast('লিংক কপি হয়েছে! এখন বন্ধুদের কাছে পাঠান।'))
                .catch(() => showToast('দুঃখিত, লিংক কপি করা হয়নি।', true));
        }

        // Android external link handler
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('a').forEach(function (link) {
                link.addEventListener('click', function (e) {
                    var href = link.getAttribute('href');
                    if (href && href.startsWith('http') && !href.includes('sylheti.kamildex.com')) {
                        if (typeof window.AppInventor !== 'undefined' && window.AppInventor.setWebViewString) {
                            e.preventDefault();
                            window.AppInventor.setWebViewString(href);
                        }
                    }
                });
            });
        });

        // Blog post loader
        let visiblePosts = 0;
        let allPosts = [];

        function formatDate(isoString) {
            if (!isoString || isoString === '1970-01-01') return 'তারিখ পাওয়া যায়নি';
            return new Date(isoString).toLocaleDateString('bn-BD', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        async function loadPosts() {
            document.getElementById('loading-indicator').style.display = 'block';

            try {
                const response = await fetch('/api/posts');
                const files = await response.json();

                const excludedFiles = ['index.html', 'terms.html', 'draft.html', 'do-not-show.html'];

                const filteredFiles = files.filter(file =>
                    file.name.endsWith('.html') &&
                    !excludedFiles.includes(file.name.toLowerCase())
                );

                // Fetch commit dates for all posts in parallel, format once and cache
                const filesWithDates = await Promise.all(
                    filteredFiles.map(async (file) => {
                        try {
                            const res = await fetch(`/api/commits?filename=${file.name}`);
                            const commits = await res.json();
                            const rawDate = commits?.[0]?.commit?.committer?.date || '1970-01-01';
                            return { ...file, rawDate, displayDate: formatDate(rawDate) };
                        } catch {
                            return { ...file, rawDate: '1970-01-01', displayDate: 'তারিখ পাওয়া যায়নি' };
                        }
                    })
                );

                filesWithDates.sort((a, b) => new Date(b.rawDate) - new Date(a.rawDate));

                allPosts = filesWithDates;
                visiblePosts = 0;
                document.getElementById('posts-container').innerHTML = '';

                await loadMorePosts();

                document.getElementById('loading-indicator').style.display = 'none';
            } catch (error) {
                console.error('Error loading posts:', error);
                alert('সমস্যা হয়েছে! একটু পরে আবার চেষ্টা করুন।');
                document.getElementById('loading-indicator').style.display = 'none';
            }
        }

        async function loadMorePosts() {
            const postsContainer = document.getElementById('posts-container');
            const nextPosts = allPosts.slice(visiblePosts, visiblePosts + 5);

            // Fetch all post HTMLs in parallel instead of one-by-one
            const postDataList = await Promise.all(
                nextPosts.map(async (file) => {
                    try {
                        const res = await fetch(file.download_url);
                        const html = await res.text();
                        const doc = new DOMParser().parseFromString(html, 'text/html');
                        const title = doc.querySelector('title')?.textContent || 'নামবিহীন পোস্ট';
                        const metaDesc = doc.querySelector('meta[name="description"]')?.getAttribute('content');
                        const excerpt = metaDesc
                            ? metaDesc.slice(0, 130) + '...'
                            : (doc.querySelector('p')?.textContent.slice(0, 130) + '...' || 'কোনো বর্ণনা নেই');
                        return { file, title, excerpt };
                    } catch {
                        return { file, title: 'নামবিহীন পোস্ট', excerpt: 'কোনো বর্ণনা নেই' };
                    }
                })
            );

            for (const { file, title, excerpt } of postDataList) {
                const fileNameWithoutExt = file.name.replace('.html', '');
                const postItem = document.createElement('li');
                postItem.className = 'post-item';
                postItem.innerHTML = `
                    <a href="/blog/${fileNameWithoutExt}" style="text-decoration:none;color:inherit;">
                        <div class="post-meta">
                            <span><i class="fas fa-sync-alt"></i> সবশেষ আপডেট : ${file.displayDate}</span>
                        </div>
                        <h2 class="post-title">${title}</h2>
                        <p class="post-excerpt">${excerpt}</p>
                    </a>
                `;
                postsContainer.appendChild(postItem);
            }

            visiblePosts += 5;
            updateLoadMoreButton();
        }

        function updateLoadMoreButton() {
            const loadMoreButton = document.getElementById('loadMore');
            loadMoreButton.style.display = visiblePosts >= allPosts.length ? 'none' : 'block';
        }

        window.onload = loadPosts;
    </script>
</body>
