    * {

      margin: 0;

    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    }

    }

      padding: 14px 30px;

      color: white;
      text-decoration: none;
      font-size: 1rem;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }
    .container a:hover {
      background-color: #0056b3;
    }
    @media (max-width: 600px) {
      .container h1 {
        font-size: 4rem;
      }
      .container p {
